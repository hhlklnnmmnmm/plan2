<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Quiz</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1f2e;
        }

        #carte {
            background: #242b3d;
            border-radius: 14px;
            padding: 30px;
            width: 480px;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
        }
    </style>
</head>
<body>
<div id="carte">
  <div id="compteur">
    Question 1 / 3
  </div>
  <div id="barre-progres">
    <div id="barre-remplie"></div>
  </div>
  <div id="question">Quel est le nombre de couleurs d'un arc-en-ciel ? </div>
  <div id="liste-reponses"></div>
</div>

<div id="resultat" style="display:none;">
  <h2 id="resultat-titre">Résultat</h2>
  <p id="resultat-detail">Score</p>
  <button id="rejouer">Rejouer</button>
</div>
</body>
</html>
